name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3.41.x trae Dart 3.11.5, el mínimo que pide el pubspec
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # El keystore viaja como secreto en base64; key.properties se
      # genera aquí con las credenciales, igual que en local.
      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          keyAlias=$KEY_ALIAS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: marmot-lovers-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90

      # Con cada merge a main: lee la versión del pubspec y crea (o
      # actualiza) la release v<versión> solo con el APK arm64.
      - name: Leer versión del pubspec
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar en GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
